# Detekt configuration for KotlinMania.
# Enforces zero-warning static analysis. Rules that conflict with 1:1
# line-by-line Rust-to-Kotlin port structures (like method length, parameter
# count, or return count) are disabled to prevent false positives on upstream
# algorithmic shapes, while strict bug, performance, and unused-code checks
# remain active with maxIssues: 0.

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true

processors:
  active: true

potential-bugs:
  active: true
  EqualsWithHashCodeExist: { active: true }
  ExplicitGarbageCollectionCall: { active: true }
  LateinitUsage: { active: false }
  NullCheckOnMutableProperty: { active: true }
  UnreachableCode: { active: true }
  WrongEqualsTypeParameter: { active: true }
  UnsafeCallOnNullableType: { active: true }
  UnnecessaryNotNullOperator: { active: false }
  ImplicitDefaultLocale: { active: true }

performance:
  active: true
  SpreadOperator: { active: false }

style:
  active: true
  MagicNumber: { active: false }
  NewLineAtEndOfFile: { active: true }
  ReturnCount: { active: false }
  UnusedImports: { active: true }
  UnnecessaryInheritance: { active: true }
  UtilityClassWithPublicConstructor: { active: true }
  DestructuringDeclarationWithTooManyEntries: { active: false }
  ProtectedMemberInFinalClass: { active: true }
  MaxLineLength: { active: false }
  UseCheckOrError: { active: false }
  UseRequire: { active: false }
  ForbiddenComment: { active: false }
  ThrowsCount: { active: false }
  LoopWithTooManyJumpStatements: { active: false }
  UnusedParameter: { active: false }
  FunctionOnlyReturningConstant: { active: false }
  WildcardImport: { active: false }
  ModifierOrder: { active: true }
  UnusedPrivateProperty: { active: false }
  UnusedPrivateMember: { active: false }
  RedundantVisibilityModifierRule: { active: false }
  UnnecessaryAbstractClass: { active: false }
  BracesOnIfStatements: { active: false }
  BracesOnWhenStatements: { active: false }
  MandatoryBracesLoops: { active: false }
  OptionalAbstractKeyword: { active: true }
  VarCouldBeVal: { active: false }
  MayBeConst: { active: false }
  SerialVersionUIDInSerializableClass: { active: false }
  DataClassShouldBeImmutable: { active: false }
  EqualsNullCall: { active: false }
  ExplicitItLambdaParameter: { active: false }
  ExpressionBodySyntax: { active: false }
  ForbiddenVoid: { active: false }
  ObjectLiteralToLambda: { active: false }
  OptionalUnit: { active: false }
  PreferToOverPairSyntax: { active: false }
  SafeCast: { active: false }
  TrailingWhitespace: { active: false }
  UnderscoresInNumericLiterals: { active: false }
  UnnecessaryApply: { active: false }
  UnnecessaryFilter: { active: false }
  UnnecessaryLet: { active: false }
  UnnecessaryParentheses: { active: false }
  UntilInsteadOfRangeTo: { active: false }
  UseArrayLiteralsInAnnotations: { active: false }
  UseEmptyCounterpart: { active: false }
  UseIfEmptyOrIfBlank: { active: false }
  UseIsNullOrEmpty: { active: false }
  UseOrEmpty: { active: false }
  UseSumOfInsteadOfFlatMapSize: { active: false }

complexity:
  active: true
  LongMethod: { active: false }
  LargeClass: { active: false }
  CyclomaticComplexMethod: { active: false }
  TooManyFunctions: { active: false }
  NestedBlockDepth: { active: false }
  LongParameterList: { active: false }
  ComplexCondition: { active: false }
  LabeledExpression: { active: false }
  MethodOverloading: { active: false }
  NestedScopeFunctions: { active: false }
  ReplaceSafeCallChainWithRun: { active: false }
  StringLiteralDuplication: { active: false }

empty-blocks:
  active: true
  EmptyClassBlock: { active: false }
  EmptyDefaultConstructor: { active: false }
  EmptyDoWhileBlock: { active: true }
  EmptyElseBlock: { active: true }
  EmptyFinallyBlock: { active: true }
  EmptyForBlock: { active: false }
  EmptyFunctionBlock: { active: false }
  EmptyIfBlock: { active: false }
  EmptyInitBlock: { active: true }
  EmptyKtFile: { active: false }
  EmptySecondaryConstructor: { active: true }
  EmptyTryBlock: { active: true }
  EmptyWhenBlock: { active: false }
  EmptyWhileBlock: { active: false }

naming:
  active: true
  TopLevelPropertyNaming: { active: false }
  FunctionNaming: { active: false }
  ClassNaming: { active: false }
  EnumNaming: { active: false }
  VariableNaming: { active: false }
  ConstructorParameterNaming: { active: false }
  FunctionParameterNaming: { active: false }
  MatchingDeclarationName: { active: false }
  ObjectPropertyNaming: { active: false }
  PackageNaming: { active: false }
  InvalidPackageDeclaration: { active: false }
  MemberNameEqualsClassName: { active: false }
  NoNameShadowing: { active: false }
  NonBooleanPropertyPrefixedWithIs: { active: false }

exceptions:
  active: true
  TooGenericExceptionThrown: { active: false }
  TooGenericExceptionCaught: { active: false }
  SwallowedException: { active: false }
  InstanceOfCheckForException: { active: false }
  ExceptionRaisedInUnexpectedLocation: { active: false }
  ThrowingExceptionsWithoutMessageOrCause: { active: false }
  PrintStackTrace: { active: false }
  RethrowCaughtException: { active: false }
  ReturnFromFinally: { active: false }
  ThrowingExceptionFromFinally: { active: false }
  ThrowingExceptionInMain: { active: false }
  ThrowingNewInstanceOfSameException: { active: false }

coroutines:
  active: false
